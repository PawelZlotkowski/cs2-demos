<!doctype html>
<!-- Film Room static reference, exported from the design canvas on 15 Nov 2026. Sample data only. Not app code: rebuild as React components using tokens. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio on a phone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090B}
a{color:#A4AAB4;text-decoration:none}
.num{font-family:'Archivo',sans-serif;font-stretch:68%;font-variant-numeric:tabular-nums}
.code{font-family:'Archivo',sans-serif;font-stretch:80%;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.ev{font-family:'Archivo',sans-serif;font-stretch:80%;font-weight:600;letter-spacing:.03em;font-size:11px;color:#EDEFF2;border:1px solid #2E333B;border-radius:4px;padding:1px 5px;background:#111317}
.mchip{height:44px;padding:0 12px;border-radius:6px;border:1px solid #23272E;display:flex;align-items:center;gap:7px;flex:none;font-size:13px;color:#A4AAB4;box-sizing:border-box}
</style>

<div style="width:390px;height:844px;box-sizing:border-box;background:#0C0D10;color:#EDEFF2;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden">

  <header style="height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;border-bottom:1px solid #1A1D22">
    <svg width="20" height="20" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="#EDEFF2" stroke-width="1.5"></rect><path d="M6 15V7h5a2.5 2.5 0 0 1 0 5H6m5 0 4 3" fill="none" stroke="#EDEFF2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span class="code" style="font-size:12px;color:#A4AAB4">ANUBIS</span>
    <span class="num" style="font-size:22px;font-weight:800">13<span style="color:#5B616B;padding:0 4px">:</span><span style="color:#7D8490">7</span></span>
    <div style="flex:1"></div>
    <button type="button" aria-label="Menu" style="width:44px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="#EDEFF2" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
  </header>

  <nav aria-label="Moments" style="display:flex;gap:6px;padding:10px 16px;overflow:hidden;flex:none">
    <a class="mchip" href="#"><span class="num" style="font-size:16px;font-weight:700">01</span><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.5" fill="#7EA6FF"></circle></svg></a>
    <a class="mchip" href="#" aria-current="true" style="border-color:#EDEFF2;background:#171A1F;color:#EDEFF2"><span class="num" style="font-size:16px;font-weight:700">02</span><svg width="9" height="8" viewBox="0 0 10 9" aria-hidden="true"><path d="M5 0 10 9H0Z" fill="#FF7A3D"></path></svg><span style="font-weight:600">Shot while moving</span></a>
    <a class="mchip" href="#"><span class="num" style="font-size:16px;font-weight:700">03</span><svg width="9" height="8" viewBox="0 0 10 9" aria-hidden="true"><path d="M5 0 10 9H0Z" fill="#FF7A3D"></path></svg></a>
    <a class="mchip" href="#"><span class="num" style="font-size:16px;font-weight:700">04</span></a>
  </nav>

  <div style="position:relative;height:330px;flex:none;background:#050607">
    <span style="position:absolute;left:8px;top:8px;width:12px;height:12px;border-left:1.5px solid #5B616B;border-top:1.5px solid #5B616B"></span>
    <span style="position:absolute;right:8px;top:8px;width:12px;height:12px;border-right:1.5px solid #5B616B;border-top:1.5px solid #5B616B"></span>
    <span style="position:absolute;left:8px;bottom:8px;width:12px;height:12px;border-left:1.5px solid #5B616B;border-bottom:1.5px solid #5B616B"></span>
    <span style="position:absolute;right:8px;bottom:8px;width:12px;height:12px;border-right:1.5px solid #5B616B;border-bottom:1.5px solid #5B616B"></span>
    <div style="position:absolute;left:30px;top:2px;width:330px;height:330px;overflow:hidden">
      <div style="position:absolute;left:-150px;top:-140px;width:560px;height:560px">
        <img src="../../apps/web/public/maps/de_anubis_radar.png" alt="Anubis radar, zoomed to Canal" style="position:absolute;inset:0;width:100%;height:100%;filter:grayscale(.62) brightness(.5) contrast(1.15)">
        <svg viewBox="0 0 1024 1024" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">
          <path d="M398 742 L444 700 L486 664 L524 628 L562 604" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round"></path>
          <path d="M562 604 L716 548 L716 650 Z" fill="#FFFFFF" fill-opacity=".09"></path>
          <circle cx="562" cy="604" r="14" fill="#FFFFFF" stroke="#050607" stroke-width="4"></circle>
          <circle cx="694" cy="590" r="12" fill="#FF5A6A" stroke="#050607" stroke-width="3"></circle>
          <circle cx="742" cy="520" r="12" fill="#FF5A6A" stroke="#050607" stroke-width="3"></circle>
          <circle cx="472" cy="694" r="11" fill="#AEB8C4" stroke="#050607" stroke-width="3"></circle>
        </svg>
      </div>
    </div>
  </div>

  <div style="flex:none;padding:8px 12px 0;display:flex;align-items:center;gap:8px">
    <button type="button" aria-label="Play" style="width:44px;height:44px;border-radius:22px;border:0;background:#EDEFF2;display:inline-flex;align-items:center;justify-content:center"><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="#0C0D10"></path></svg></button>
    <span class="num" style="font-size:26px;font-weight:700">0:41.3</span>
    <span class="code" style="font-size:12px;padding:3px 6px;border:1px solid #2E333B;border-radius:4px">4<span style="color:#7D8490">v</span>5</span>
    <div style="flex:1"></div>
    <div role="group" aria-label="View" style="display:flex;padding:2px;border-radius:6px;background:#15181D;border:1px solid #23272E">
      <button type="button" aria-pressed="true" style="font-family:inherit;font-size:12px;font-weight:600;height:36px;padding:0 10px;border-radius:4px;border:0;background:#262A31;color:#EDEFF2">Radar</button>
      <button type="button" aria-pressed="false" style="font-family:inherit;font-size:12px;font-weight:600;height:36px;padding:0 10px;border-radius:4px;border:0;background:transparent;color:#A4AAB4">Clip</button>
    </div>
  </div>
  <div style="position:relative;height:30px;margin:6px 16px 0;flex:none">
    <div style="position:absolute;left:0;right:0;top:14px;height:2px;background:#262A31;border-radius:1px"></div>
    <div style="position:absolute;left:32%;width:9%;top:4px;height:22px;background:rgba(255,122,61,.12);border-left:1px solid rgba(255,122,61,.5);border-right:1px solid rgba(255,122,61,.5)"></div>
    <svg style="position:absolute;left:34%;top:9px" width="10" height="9" viewBox="0 0 10 9" aria-hidden="true"><path d="M5 0 10 9H0Z" fill="#FF7A3D"></path></svg>
    <div style="position:absolute;left:35.9%;top:0;width:2px;height:30px;background:#EDEFF2"></div>
  </div>

  <section aria-label="Coach" style="position:absolute;left:0;right:0;bottom:0;height:300px;background:#111317;border-top:1px solid #2A2F37;border-radius:12px 12px 0 0;padding:8px 20px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
    <span aria-hidden="true" style="align-self:center;width:36px;height:4px;border-radius:2px;background:#3A3F48"></span>
    <span style="display:flex;align-items:center;gap:7px;font-size:12px;color:#A4AAB4"><svg width="10" height="9" viewBox="0 0 10 9" aria-hidden="true"><path d="M5 0 10 9H0Z" fill="#FF7A3D"></path></svg>Mistake · moment 2 of 6 · round 12</span>
    <h1 style="margin:0;font-size:20px;line-height:26px;font-weight:600">Shot while moving at Canal</h1>
    <p style="margin:0;font-size:15px;line-height:23px;color:#C9CDD3">You fired 3 shots at up to 187 u/s while peeking Canal <span class="ev">F07</span>. The AK-47 is only accurate below 73 u/s.</p>
    <span style="display:flex;align-items:center;gap:8px;font-size:12px;color:#A4AAB4"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.25" fill="none" stroke="#A4AAB4" stroke-width="1.2"></circle><path d="m4.2 7.2 1.9 1.9 3.8-4" fill="none" stroke="#EDEFF2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span><b style="color:#EDEFF2;font-weight:600">Checked</b> · 4 of 4 claims match</span></span>
    <div style="display:flex;gap:8px;margin-top:auto">
      <label for="mask" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ask the coach</label>
      <input id="mask" placeholder="Ask about this moment" style="flex:1;min-width:0;height:44px;box-sizing:border-box;border-radius:6px;border:1px solid #3A3F48;background:#15181D;color:#EDEFF2;font-family:inherit;font-size:16px;padding:0 12px">
      <button type="button" style="height:44px;padding:0 14px;border-radius:6px;border:1px solid #2E333B;background:#1E2228;color:#EDEFF2;font-family:inherit;font-size:14px;font-weight:600">Ask</button>
    </div>
  </section>
</div>

</body>
</html>
