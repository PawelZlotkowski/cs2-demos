[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "round-reviewer-api"
version = "0.1.0"
description = "Round Reviewer FastAPI foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "zstandard>=0.22",
  "demoparser2>=0.42",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["maps/zones/*.json", "coach/templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
