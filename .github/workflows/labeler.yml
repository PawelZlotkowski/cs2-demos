name: Labeller
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/package_labeler.py --check-git
      - run: python tools/package_labeler.py --output /tmp/labeler.zip
      - run: python -m zipfile -e /tmp/labeler.zip /tmp/labeler-kit
      - run: docker build --target test-core -f /tmp/labeler-kit/docker/Dockerfile.labeler -t labeler-test /tmp/labeler-kit
      - run: docker run --rm labeler-test
      - run: bash tools/test_labeler_launcher.sh
  windows-recorder:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools -p test_record_label_clips.py
      - run: ./tools/test_labeler_launcher.ps1
      - run: node tools/test_label_batches.cjs
      - run: node tools/test_label_navigation.cjs
  web-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: labeler-test
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    env:
      LABELER_TEST_ADMIN_URL: postgres://postgres:labeler-test@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:labeler
